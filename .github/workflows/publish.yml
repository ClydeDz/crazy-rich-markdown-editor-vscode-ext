# Builds and tests the extension on every push and pull request.
# A push to main publishes a new version to the Visual Studio Marketplace and creates a GitHub release with the VSIX.
#
# Set up once:
#   1. In package.json, set "publisher" to the ID of your Marketplace publisher. The value "local" cannot publish.
#   2. Make an access token: https://aex.dev.azure.com/ > Select an organisation > User settings > Personal access tokens > New token.
#      Organization: All accessible organizations. Scope: Marketplace > Manage.
#   3. Add the token as the repository secret VSCE_PAT (Settings > Secrets and variables > Actions).
#   4. Optional: in Settings > Environments, open "marketplace" and add a required reviewer.
#      Then a person must approve each release.
#
# To release: raise "version" in package.json, and merge the change to main.
# A push to main with a version that the Marketplace already holds ensures its GitHub release has the VSIX.

name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Let a release on main finish. Stop an old pull request run when a new commit arrives.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn typecheck

      # The tests also read the examples of the GitHub Markdown page from the internet.
      - run: yarn test

      # The package script runs the production build first (vscode:prepublish).
      - run: yarn package

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'
          if-no-files-found: error

  publish:
    name: Publish to the Marketplace
    needs: build
    # Only a push to main (or a manual run on main) publishes. A pull request never does.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: marketplace
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      # The publish step needs the vsce tool from the dev dependencies.
      - run: yarn install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: vsix

      # Stops with an error when the publisher or VSCE_PAT is not set up. Skips when the version is already published.
      - id: check
        run: node scripts/check-publish.mjs vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      # This publishes the same file that the build job tested.
      - if: steps.check.outputs.publish == 'true'
        run: yarn vsce publish --packagePath "$VSIX"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VSIX: ${{ steps.check.outputs.vsix }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VSIX: ${{ steps.check.outputs.vsix }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$VSIX" --clobber
          else
            gh release create "$TAG" "$VSIX" --title "$VERSION" --generate-notes
          fi
